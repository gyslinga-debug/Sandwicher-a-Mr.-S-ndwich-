<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A66B3A">
  <title>Caja Virtual | Mr. Sandwich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="app-header-content">
      <div class="brand">
        <a href="B16_Dashboard.html" class="brand-icon" style="text-decoration: none; color: inherit;">
          <img src="assets/images/logo.png" alt="Mr. Sandwich Logo" style="width: 50px; height: 50px; object-fit: contain;">
        </a>
        <div class="brand-text">
          <h1>Mr. Sandwich</h1>
          <p>Caja Virtual</p>
        </div>
      </div>
      <div class="app-header-actions">
        <button class="icon-button" onclick="window.history.back()">←</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Page Header -->
    <section style="margin: var(--spacing-xl) 0; text-align: center;">
      <div style="font-size: 3rem; margin-bottom: var(--spacing-lg); color: var(--brand-brown);">💰</div>
      <h1 style="margin-bottom: var(--spacing-md); color: var(--brand-brown-dark);">Caja Virtual</h1>
      <p style="font-size: 1rem; margin-bottom: var(--spacing-xl); color: rgba(43,43,43,0.7);">
        Sistema de punto de venta
      </p>
    </section>

    <!-- Current Order Section -->
    <section style="max-width: 800px; margin: 0 auto var(--spacing-2xl) auto;">
      <!-- Order Items -->
      <div style="background: white; border-radius: var(--border-radius); padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); box-shadow: 0 4px 20px rgba(166, 107, 58, 0.1); border: 2px solid rgba(166, 107, 58, 0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
          <h2 style="margin: 0; color: var(--brand-brown-dark); font-size: 1.3rem;">🛒 Orden Actual</h2>
          <button onclick="clearOrder()" style="background: var(--brand-red); color: white; border: none; padding: var(--spacing-xs) var(--spacing-sm); border-radius: var(--border-radius); font-size: 0.85rem; font-weight: 600; cursor: pointer;">
            Limpiar
          </button>
        </div>

        <div id="orderItems" style="margin-bottom: var(--spacing-lg);">
          <!-- Items will be added dynamically -->
        </div>

        <!-- Add Product -->
        <div style="border-top: 1px solid #e1e5e9; padding-top: var(--spacing-lg);">
          <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600; color: var(--brand-brown-dark);">Agregar producto</label>
          <div style="display: flex; gap: var(--spacing-sm);">
            <select id="productSelect" style="flex: 1; padding: var(--spacing-md); border: 2px solid #e1e5e9; border-radius: var(--border-radius); font-size: 1rem; background: white; cursor: pointer;">
              <option value="">Seleccionar producto...</option>
            </select>
            <button onclick="addProduct()" style="background: var(--brand-brown); color: white; border: none; padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--border-radius); font-size: 1rem; font-weight: 600; cursor: pointer; white-space: nowrap;">
              ➕ Agregar
            </button>
          </div>
        </div>

        <!-- Empty State -->
        <div id="emptyOrder" style="text-align: center; padding: var(--spacing-2xl); display: none;">
          <div style="font-size: 3rem; margin-bottom: var(--spacing-lg); opacity: 0.5;">🛒</div>
          <p style="color: rgba(43,43,43,0.7);">No hay productos en la orden</p>
        </div>
      </div>

      <!-- Payment Section -->
      <div id="paymentSection" style="background: white; border-radius: var(--border-radius); padding: var(--spacing-xl); box-shadow: 0 4px 20px rgba(166, 107, 58, 0.1); border: 2px solid rgba(166, 107, 58, 0.1); display: none;">
        <h2 style="margin-bottom: var(--spacing-lg); color: var(--brand-brown-dark); font-size: 1.3rem;">💳 Procesar Pago</h2>

        <!-- Total -->
        <div style="background: var(--brand-beige); border-radius: var(--border-radius); padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); text-align: center;">
          <div style="font-size: 0.9rem; color: var(--brand-brown); margin-bottom: var(--spacing-xs);">Total a pagar</div>
          <div id="totalAmount" style="font-size: 2.5rem; font-weight: 800; color: var(--brand-brown-dark);">$0</div>
        </div>

        <!-- Payment Method -->
        <div style="margin-bottom: var(--spacing-lg);">
          <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600; color: var(--brand-brown-dark);">Método de pago</label>
          <select id="paymentMethod" style="width: 100%; padding: var(--spacing-md); border: 2px solid #e1e5e9; border-radius: var(--border-radius); font-size: 1rem; background: white; cursor: pointer;">
            <option value="efectivo">💵 Efectivo</option>
            <option value="tarjeta">💳 Tarjeta</option>
            <option value="transferencia">🏦 Transferencia</option>
          </select>
        </div>

        <!-- Cash Payment Details -->
        <div id="cashDetails" style="margin-bottom: var(--spacing-lg);">
          <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600; color: var(--brand-brown-dark);">Monto recibido</label>
          <input 
            id="cashReceived" 
            type="number" 
            placeholder="0" 
            oninput="calculateChange()"
            style="width: 100%; padding: var(--spacing-md); border: 2px solid #e1e5e9; border-radius: var(--border-radius); font-size: 1.2rem; text-align: center; font-weight: 600;">
          
          <div id="changeAmount" style="margin-top: var(--spacing-md); padding: var(--spacing-md); background: #e8f5e9; border-radius: var(--border-radius); text-align: center; display: none;">
            <div style="font-size: 0.9rem; color: #2e7d32; margin-bottom: var(--spacing-xs);">Cambio</div>
            <div style="font-size: 1.8rem; font-weight: 700; color: #1b5e20;">$0</div>
          </div>
        </div>

        <!-- Process Payment Button -->
        <button onclick="processPayment()" style="width: 100%; background: var(--brand-green); color: white; border: none; padding: var(--spacing-lg); border-radius: var(--border-radius); font-size: 1.2rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(39, 150, 91, 0.3); margin-bottom: var(--spacing-md);">
          ✅ Procesar Pago
        </button>

        <button onclick="cancelPayment()" style="width: 100%; background: #e1e5e9; color: #2b2b2b; border: none; padding: var(--spacing-md); border-radius: var(--border-radius); font-size: 1rem; font-weight: 600; cursor: pointer;">
          Cancelar
        </button>

        <div id="paymentMsg" style="margin-top: var(--spacing-lg);"></div>
      </div>
    </section>
  </main>

  <!-- Success Modal -->
  <div id="successModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; padding: var(--spacing-lg);">
    <div style="background: white; border-radius: var(--border-radius); padding: var(--spacing-2xl); max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
      <div style="font-size: 4rem; margin-bottom: var(--spacing-lg);">✅</div>
      <h2 style="margin-bottom: var(--spacing-md); color: var(--brand-brown-dark);">¡Pago Exitoso!</h2>
      <p style="margin-bottom: var(--spacing-xl); color: rgba(43,43,43,0.7);">
        La transacción se ha procesado correctamente
      </p>
      <div style="display: flex; flex-direction: column; gap: var(--spacing-md);">
        <button onclick="viewReceipt()" style="width: 100%; background: var(--brand-green); color: white; border: none; padding: var(--spacing-md); border-radius: var(--border-radius); font-size: 1rem; font-weight: 600; cursor: pointer;">
          📄 Ver Boleta
        </button>
        <button onclick="closeSuccessModal()" style="width: 100%; background: var(--brand-brown); color: white; border: none; padding: var(--spacing-md); border-radius: var(--border-radius); font-size: 1rem; font-weight: 600; cursor: pointer;">
          Nueva Orden
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let currentOrder = [];
    let allProducts = [];

    // Función para asignar emoji distintivo según el nombre del producto
    function getProductEmoji(productName, category) {
      const name = productName.toLowerCase();
      
      // Emojis específicos por palabras clave
      if (name.includes('pollo') || name.includes('chicken')) return '🍗';
      if (name.includes('carne') || name.includes('beef') || name.includes('parrilla')) return '🥩';
      if (name.includes('jamón') || name.includes('ham')) return '🥓';
      if (name.includes('veggie') || name.includes('vegano') || name.includes('vegetales')) return '🥗';
      if (name.includes('tostado') || name.includes('toast')) return '🍞';
      if (name.includes('club')) return '🥪';
      if (name.includes('premium') || name.includes('mixto')) return '👑';
      if (name.includes('doble') || name.includes('double')) return '🍔';
      if (name.includes('italiano')) return '🇮🇹';
      if (name.includes('clásico') || name.includes('classic')) return '🥖';
      
      // Por categoría
      if (category) {
        const cat = category.toLowerCase();
        if (cat.includes('pollo')) return '🍗';
        if (cat.includes('carne')) return '🥩';
        if (cat.includes('vegano')) return '🥗';
        if (cat.includes('premium')) return '👑';
      }
      
      // Default
      return '🥪';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadProducts();
      updateOrderDisplay();
      
      // Payment method change handler
      document.getElementById('paymentMethod').addEventListener('change', function() {
        const cashDetails = document.getElementById('cashDetails');
        cashDetails.style.display = this.value === 'efectivo' ? 'block' : 'none';
      });
    });

    async function loadProducts() {
      try {
        const data = await window.api.getProducts();
        allProducts = (data.products || data || []).map(p => ({
          ...p,
          emoji: getProductEmoji(p.name, p.category)
        }));
        
        const select = document.getElementById('productSelect');
        select.innerHTML = '<option value="">Seleccionar producto...</option>' + 
          allProducts.map(p => `<option value="${p._id}">${p.emoji} ${p.name} - $${p.price.toLocaleString('es-CL')}</option>`).join('');
      } catch (error) {
        console.error('Error loading products:', error);
      }
    }

    function addProduct() {
      const select = document.getElementById('productSelect');
      const productId = select.value;
      
      if (!productId) return;
      
      const product = allProducts.find(p => p._id === productId);
      if (!product) return;
      
      const existingItem = currentOrder.find(item => item.product._id === productId);
      
      if (existingItem) {
        existingItem.quantity++;
      } else {
        currentOrder.push({
          product: product,
          quantity: 1
        });
      }
      
      select.value = '';
      updateOrderDisplay();
    }

    function removeItem(index) {
      currentOrder.splice(index, 1);
      updateOrderDisplay();
    }

    function updateQuantity(index, delta) {
      currentOrder[index].quantity += delta;
      if (currentOrder[index].quantity <= 0) {
        removeItem(index);
      } else {
        updateOrderDisplay();
      }
    }

    function updateOrderDisplay() {
      const container = document.getElementById('orderItems');
      const emptyState = document.getElementById('emptyOrder');
      const paymentSection = document.getElementById('paymentSection');
      
      if (currentOrder.length === 0) {
        container.style.display = 'none';
        emptyState.style.display = 'block';
        paymentSection.style.display = 'none';
        return;
      }
      
      container.style.display = 'block';
      emptyState.style.display = 'none';
      paymentSection.style.display = 'block';
      
      let total = 0;
      
      container.innerHTML = currentOrder.map((item, index) => {
        const subtotal = item.product.price * item.quantity;
        total += subtotal;
        
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-md); background: #f8f9fa; border-radius: var(--border-radius); margin-bottom: var(--spacing-sm);">
            <div style="flex: 1;">
              <div style="font-weight: 600; color: var(--brand-brown-dark); margin-bottom: 4px;">${item.product.emoji || '🥪'} ${item.product.name}</div>
              <div style="font-size: 0.9rem; color: rgba(43,43,43,0.7);">$${item.product.price.toLocaleString('es-CL')} × ${item.quantity}</div>
            </div>
            <div style="display: flex; align-items: center; gap: var(--spacing-md);">
              <div style="display: flex; align-items: center; gap: var(--spacing-xs); background: white; border-radius: var(--border-radius); padding: 4px;">
                <button onclick="updateQuantity(${index}, -1)" style="background: var(--brand-beige); border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: 700;">−</button>
                <span style="min-width: 30px; text-align: center; font-weight: 600;">${item.quantity}</span>
                <button onclick="updateQuantity(${index}, 1)" style="background: var(--brand-beige); border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: 700;">+</button>
              </div>
              <div style="font-weight: 700; color: var(--brand-brown-dark); min-width: 90px; text-align: right;">$${subtotal.toLocaleString('es-CL')}</div>
              <button onclick="removeItem(${index})" style="background: var(--brand-red); color: white; border: none; width: 32px; height: 32px; border-radius: var(--border-radius); cursor: pointer; font-weight: 700;">🗑</button>
            </div>
          </div>
        `;
      }).join('');
      
      document.getElementById('totalAmount').textContent = `$${total.toLocaleString('es-CL')}`;
    }

    function calculateChange() {
      const total = currentOrder.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      const received = parseFloat(document.getElementById('cashReceived').value) || 0;
      const change = received - total;
      
      const changeDiv = document.getElementById('changeAmount');
      if (change >= 0 && received > 0) {
        changeDiv.style.display = 'block';
        changeDiv.querySelector('div:last-child').textContent = `$${change.toLocaleString('es-CL')}`;
      } else {
        changeDiv.style.display = 'none';
      }
    }

    function clearOrder() {
      if (confirm('¿Limpiar la orden actual?')) {
        currentOrder = [];
        updateOrderDisplay();
        document.getElementById('cashReceived').value = '';
        document.getElementById('changeAmount').style.display = 'none';
      }
    }

    async function processPayment() {
      if (currentOrder.length === 0) return;
      
      const paymentMethod = document.getElementById('paymentMethod').value;
      const total = currentOrder.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      
      if (paymentMethod === 'efectivo') {
        const received = parseFloat(document.getElementById('cashReceived').value) || 0;
        if (received < total) {
          alert('El monto recibido es menor al total');
          return;
        }
      }
      
      try {
        // Verificar que el usuario esté autenticado
        const token = localStorage.getItem('token');
        if (!token) {
          throw new Error('Debe iniciar sesión para realizar ventas');
        }

        // Crear el pedido en el backend
        const subtotal = currentOrder.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
        const orderData = {
          items: currentOrder.map(item => ({
            product: item.product._id,
            quantity: item.quantity,
            price: item.product.price,
            subtotal: item.product.price * item.quantity
          })),
          paymentMethod: paymentMethod,
          deliveryAddress: {
            street: 'Caja Virtual',
            number: 'S/N',
            commune: 'Punto de Venta',
            city: 'Santiago',
            instructions: 'Venta en punto de venta físico'
          },
          total: total,
          subtotal: subtotal,
          deliveryFee: 0, // Sin cargo de delivery en caja virtual
          discount: 0,
          status: 'completed' // Pedidos en caja virtual se marcan como completados inmediatamente
        };

        console.log('Enviando orden:', orderData); // Debug
        
        const response = await fetch(`http://localhost:5000/api/orders`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(orderData)
        });

        console.log('Respuesta del servidor:', response.status); // Debug

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Error del servidor:', errorText); // Debug
          let errorMessage = 'Error al crear el pedido';
          try {
            const error = JSON.parse(errorText);
            errorMessage = error.message || errorMessage;
          } catch (e) {
            errorMessage = errorText || errorMessage;
          }
          throw new Error(errorMessage);
        }

        const order = await response.json();
        console.log('Orden creada:', order); // Debug
        
        // Guardar información de la venta para la boleta
        localStorage.setItem('lastSale', JSON.stringify({
          orderId: order._id,
          items: currentOrder,
          total: total,
          paymentMethod: paymentMethod,
          cashReceived: paymentMethod === 'efectivo' ? parseFloat(document.getElementById('cashReceived').value) : total,
          change: paymentMethod === 'efectivo' ? parseFloat(document.getElementById('cashReceived').value) - total : 0,
          date: new Date().toISOString()
        }));
        
        // Mostrar modal de éxito
        document.getElementById('successModal').style.display = 'flex';
        
      } catch (error) {
        console.error('Error al procesar el pago:', error);
        alert('Error al registrar el pedido: ' + error.message);
      }
    }

    function cancelPayment() {
      if (confirm('¿Cancelar el pago actual?')) {
        document.getElementById('cashReceived').value = '';
        document.getElementById('changeAmount').style.display = 'none';
      }
    }

    function closeSuccessModal() {
      document.getElementById('successModal').style.display = 'none';
      clearOrder();
      document.getElementById('paymentMethod').value = 'efectivo';
      document.getElementById('cashReceived').value = '';
      document.getElementById('changeAmount').style.display = 'none';
    }

    function viewReceipt() {
      window.location.href = 'B14_Boleta_Digital.html';
    }
  </script>
</body>
</html>
