<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A66B3A">
  <title>Inicio de Sesión | Mr. Sandwich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    /* Animaciones para login */
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-20px) translateX(10px); }
    }
    
    .card {
      animation: scaleIn 0.5s ease-out;
    }
    
    .btn {
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
      pointer-events: none;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(166, 107, 58, 0.3);
    }
    
    .form-control {
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(166, 107, 58, 0.2);
    }
    
    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(166,107,58,0.1) 0%, transparent 70%);
      top: -200px;
      left: -200px;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    
    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(39,150,91,0.08) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      animation: float 10s ease-in-out infinite reverse;
      pointer-events: none;
      z-index: 0;
    }
    
    .container {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="app-header-content">
      <div class="brand">
        <a href="index.html" class="brand-icon" style="text-decoration: none; color: inherit;">
          <img src="assets/images/logo.png" alt="Mr. Sandwich Logo" style="width: 50px; height: 50px; object-fit: contain;">
        </a>
        <div class="brand-text">
          <h1>Mr. Sandwich</h1>
          <p>Sabor que te acompaña</p>
        </div>
      </div>
      <div class="app-header-actions">
        <button class="icon-button" onclick="history.back()">←</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Login Form -->
    <section style="margin: var(--spacing-xl) 0; text-align: center;">
      <img src="assets/images/logo.png" alt="Mr. Sandwich" style="width: 120px; height: 120px; margin: 0 auto var(--spacing-lg); display: block; object-fit: contain;">
      <h1 style="margin-bottom: var(--spacing-md); color: var(--brand-brown-dark);">Iniciar sesión</h1>
      <p style="font-size: 1rem; margin-bottom: var(--spacing-xl); color: rgba(43,43,43,0.7);">
        Bienvenido de vuelta a Mr. Sandwich
      </p>
    </section>

    <section style="max-width: 400px; margin: 0 auto var(--spacing-2xl) auto;">
      <div style="background: white; border-radius: var(--border-radius); padding: var(--spacing-xl); box-shadow: 0 4px 20px rgba(166, 107, 58, 0.1); border: 2px solid rgba(166, 107, 58, 0.1);">
        <form id="loginForm">
          <div style="margin-bottom: var(--spacing-lg);">
            <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600; color: var(--brand-brown-dark);">Correo electrónico</label>
            <input id="email" name="email" type="email" style="width: 100%; padding: var(--spacing-md); border: 2px solid #e1e5e9; border-radius: var(--border-radius); font-size: 1rem; transition: border-color 0.3s;" placeholder="correo@ejemplo.com" required>
          </div>

          <div style="margin-bottom: var(--spacing-lg);">
            <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 600; color: var(--brand-brown-dark);">Contraseña</label>
            <input id="password" name="password" type="password" style="width: 100%; padding: var(--spacing-md); border: 2px solid #e1e5e9; border-radius: var(--border-radius); font-size: 1rem; transition: border-color 0.3s;" placeholder="********" required>
          </div>

          <div id="msg" style="margin-bottom: var(--spacing-lg);"></div>

          <button id="submitBtn" style="width: 100%; background: var(--brand-green); color: white; border: none; padding: var(--spacing-md); border-radius: var(--border-radius); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.3s; box-shadow: 0 4px 12px rgba(39, 150, 91, 0.3);" type="submit">
            Iniciar sesión
          </button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-lg); padding-top: var(--spacing-lg); border-top: 1px solid #e1e5e9;">
          <p style="margin: 0 0 var(--spacing-md) 0; color: rgba(43,43,43,0.7);">
            <a href="B03_Recuperar_Contrasena.html" style="color: var(--brand-brown); text-decoration: none; font-weight: 600;">¿Olvidó su contraseña?</a>
          </p>
          <p style="margin: 0; color: rgba(43,43,43,0.7);">
            ¿No tienes cuenta?
            <a href="B02_Registro.html" style="color: var(--brand-brown); text-decoration: none; font-weight: 600;">Regístrate</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="app-bottom-nav">
    <a href="index.html">
      <span class="icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="B07_Catalogo.html">
      <span class="icon">🥘</span>
      <span>Catálogo</span>
    </a>
    <a href="B10_Carrito_de_Compras.html">
      <span class="icon">🛒</span>
      <span>Carrito</span>
    </a>
    <a href="B04_Perfil_Usuario.html">
      <span class="icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Login page loaded');

      const loginForm = document.getElementById('loginForm');
      const msgEl = document.getElementById('msg');

      if (!loginForm) {
        console.error('Login form not found');
        return;
      }

      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        console.log('Login form submitted');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          msgEl.innerHTML = '<div style="background: #fee; color: #c33; padding: var(--spacing-md); border-radius: var(--border-radius); border: 1px solid #fcc;">Por favor completa todos los campos.</div>';
          return;
        }

        try {
          const data = await window.api.login(email, password);
          localStorage.setItem('token', data.token);
          if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
          }
          msgEl.innerHTML = '<div style="background: #efe; color: #363; padding: var(--spacing-md); border-radius: var(--border-radius); border: 1px solid #cfc;">Inicio de sesión exitoso. Redirigiendo...</div>';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } catch (error) {
          console.error('Login error:', error);
          const errorMessage = error.message || 'Error al iniciar sesión';
          msgEl.innerHTML = `<div style="background: #fee; color: #c33; padding: var(--spacing-md); border-radius: var(--border-radius); border: 1px solid #fcc;">${errorMessage}</div>`;
        }
      });
    });
  </script>
  <script src="js/animations.js"></script>
</body>
</html>
